<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>ch8. Spacing間隔-練習02</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mycss-ai.css">
    <style>
        .bg-cover {
            background-position: center center;
            background-size: cover;
        }
        .roller-box-top {
            position: relative; /* 作為內部絕對定位元素的基準 */
            overflow: hidden;    /* 關鍵：隱藏位移到容器外的 .roller */
        }

        /* 這是滑動遮罩層 */
        .roller-box-top .roller {
            position: absolute;  /* 絕對定位，重疊在 .box 之上 */
            top: 0;
            left: 0;
            width: 100%;         /* 撐滿父容器寬度 */
            height: 100%;        /* 撐滿父容器高度 */
            background-color: rgba(0, 0, 0, 0.3); /* 半透明黑色背景 */
            display: flex;       /* 使用彈性佈局讓內容置中 */
            align-items: center; 
            text-align: center;
            left: 0;
            top: 0;
            
            /* 關鍵語法：將遮罩位移 100%  */
            transform: translateY(-100%); 
            /* 動態過渡：設定 transform 屬性改變時，需耗時 1.5 秒的平滑動畫 */
            transition: transform 1500ms;

            display:flex;
            align-items: center;
            justify-content: center;
        }

        /* 當滑鼠懸停在 .roller-box 上時，改變內部 .roller 的狀態 */
        .bg-cover .roller-box-top:hover .roller {
            /* 將位移恢復到 0，遮罩就會滑回原位 */
            transform: translateX(0);
        }
    </style>
</head>
