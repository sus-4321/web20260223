<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷朋後台管理系統 - 訂單管理</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <style>
        /* 1. 定義 酷朋 (Coupang) 品牌核心色碼 */
        :root {
            --cp-red: #E02020;         /* 酷朋火箭紅（主核心行動色） */
            --cp-blue: #003580;        /* 火箭深邃藍（重要標籤/品牌字體色） */
            --cp-orange: #FF8A00;      /* 活力暖橘（待處理提示色） */
            --cp-bg: #F0F2F5;          /* 帶有電商冷調的淺灰底色 */
            --cp-text-main: #111111;   /* 主要資訊極致黑 */
            --cp-text-sub: #555555;    /* 欄位標籤深炭灰 */
            --cp-border: #DDDDDD;      /* 俐落包裹邊框線 */
        }

        /* 2. 整體背景與字體風格 */
        body {
            background-color: var(--cp-bg) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            color: var(--cp-text-main);
        }

        /* 3. 卡片外觀：強調如包裹般方正、俐落、邊框清晰的結構感 */
        .card.shadow-sm {
            border: 1px solid var(--cp-border) !important;
            border-radius: 6px !important; /* 較為俐落的電商微切角 */
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05) !important;
            background-color: #ffffff !important;
        }

        /* 4. 卡片頂部標題列：白底搭配深藍色品牌字 */
        .card-header.bg-white {
            background-color: #ffffff !important;
            border-bottom: 2px solid var(--cp-blue) !important; /* 火箭深藍粗下線，帶出核心主題 */
            padding: 1rem 1.25rem !important;
        }

        .card-header .fs-5 {
            color: var(--cp-blue) !important;
            font-weight: 800 !important;
            letter-spacing: -0.5px;
        }

        /* 5. 狀態標籤：原本的 text-bg-warning 覆寫為酷朋高亮橘色，代表即時、快速處理 */
        .badge.text-bg-warning {
            background-color: var(--cp-orange) !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            padding: 0.45em 0.8em !important;
            border-radius: 4px !important;
            font-size: 0.8rem !important;
        }

        /* 6. 卡片內容排版優化 */
        .card-body {
            padding: 1.25rem !important;
        }

        .card-body .fs-5.fw-bold {
            color: var(--cp-text-main) !important;
            font-size: 1.25rem !important;
        }

        .text-secondary {
            color: var(--cp-text-sub) !important;
            font-weight: 500;
        }

        .fw-bold:not(.text-danger) {
            color: var(--cp-text-main) !important;
        }

        /* 分隔線修正為標準電商灰實線 */
        .border-top {
            border-top: 1px solid var(--cp-border) !important;
        }

        /* 7. 卡片頁尾與金額（金額改為引導消費的酷朋火箭紅） */
        .card-footer {
            background-color: #FAFAFA !important; /* 頁尾做稍微的層次灰底 */
            border-top: 1px solid var(--cp-border) !important;
            padding: 1.25rem !important;
        }

        .card-footer .fw-bold {
            color: var(--cp-text-sub) !important;
        }

        /* 覆寫原本的 text-danger，把價格轉為極具衝擊感的火箭紅 */
        .text-danger {
            color: var(--cp-red) !important;
            font-size: 1.6rem !important;
            font-weight: 900 !important;
        }

        /* 8. 三顆按鈕風格全面重新洗牌 */
        .gap-2 {
            gap: 8px !important;
        }

        /* 按鈕 A：查看明細 (原本的 btn-outline-primary -> 改為象徵誠信與專業的深藍框鈕) */
        .btn.btn-outline-primary {
            background-color: #ffffff !important;
            color: var(--cp-blue) !important;
            border: 1px solid var(--cp-blue) !important;
            font-weight: 600 !important;
            border-radius: 4px !important;
            font-size: 0.9rem !important;
            padding: 0.55rem 0 !important;
            transition: all 0.2s;
        }
        .btn.btn-outline-primary:hover {
            background-color: rgba(0, 53, 128, 0.05) !important;
        }

        /* 按鈕 B：修改訂單 (原本的 btn-success -> 變身為衝動消費的核心「火箭紅」按鈕) */
        .btn.btn-success {
            background-color: var(--cp-red) !important;
            border-color: var(--cp-red) !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            border-radius: 4px !important;
            font-size: 0.9rem !important;
            padding: 0.55rem 0 !important;
            transition: background-color 0.2s;
        }
        .btn.btn-success:hover {
            background-color: #B81414 !important;
            border-color: #B81414 !important;
        }

        /* 按鈕 C：刪除訂單 (原本的 btn-outline-danger -> 改為低調的淡灰邊框，維持系統介面整潔) */
        .btn.btn-outline-danger {
            background-color: transparent !important;
            color: #888888 !important;
            border: 1px solid var(--cp-border) !important;
            font-weight: 500 !important;
            border-radius: 4px !important;
            font-size: 0.9rem !important;
            padding: 0.55rem 0 !important;
            transition: all 0.2s;
        }
        .btn.btn-outline-danger:hover {
            background-color: #F5F5F5 !important;
            color: var(--cp-red) !important;
            border-color: var(--cp-red) !important;
        }
    </style>
</head>

<body>
    <div class="container py-4" id="app">
        <div class="row g-4">
            <div class="display-3 fw-bold text-center">{{ title }}</div>
            <div class="col-12 col-md-6 col-xl-4" v-for="item in orders">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center bg-white">
                        <div class="fs-5">訂單編號 #XXX</div>
                        <span class="badge text-bg-warning">待處理</span>
                    </div>

                    <div class="card-body">
                        <div class="customer-info mb-3">
                            <div class="customer-name">
                                {{ item.customerName }}
                            </div>
                            
                            <div class="text-secondary">用餐人數: 10人</div>
                        </div>
                        <div class="border-top pt-3">
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">取餐方式</span>
                                <span class="fw-bold">櫃台取餐</span>
                            </div>
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">付款方式</span>
                                <span class="fw-bold">現金</span>
                            </div>
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">點餐數量</span>
                                <span class="fw-bold">3項</span>
                            </div>
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">備註</span>
                                <span class="fw-bold">不用餐具</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="mb-2 d-flex justify-content-between align-items-center">
                            <span class="fw-bold">總金額</span>
                            <span class="fw-bold fs-4 text-danger">1000元</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary flex-fill">查看明細</button>
                            <button class="btn btn-success flex-fill">修改訂單</button>
                            <button class="btn btn-outline-danger flex-fill">刪除訂單</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script>
        Vue.createApp({
            data(){
                return{
                    title:"訂單列表",
                    orders:[], //從json-server取得所有訂單


                }
            },
            methods: {
                getOrders(){
                    const vm = this;
                    axios.get('http://localhost:3000/orders')
                    .then(function (response){
                        console.log(response);
                        vm.orders = response.data;

                    })
                    .catch(function(error){
                        console.log(error);
                    })
                    .finally(function(){
                        // always executed
                    });
                }
            },
        }).mount("#app");
        // 在網頁戴入時會先執行的功能(譬如:取得相關資料)
    </script>
</body>

</html>
