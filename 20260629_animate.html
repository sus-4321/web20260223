<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動畫練習</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 bg-primary vh-100"></div>
        </div>
        
        <div class="row">
            <div class="col-3 bg-primary p-5 mt-5 wow animate__fadeInLeft" 
                 data-wow-duration="10s" 
                 data-wow-delay="0s" 
                 data-wow-iteration="2"></div>
        </div>
        
        <div class="row">
            <div class="col-3 bg-primary p-5 mt-5 animate__fadeInRight wow" 
                 data-wow-duration="1s" 
                 data-wow-delay="0s" 
                 data-wow-iteration="3"></div>
        </div>
        
        <div class="row">
            <div class="col-3 bg-primary p-5 mt-5 animate__animated animate__fadeInUp"></div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/wow.min.js"></script>
    <script>
        // 初始化 WOW.js，使其開始監聽滾動事件
        new WOW().init();
    </script>
</body>
</html>
