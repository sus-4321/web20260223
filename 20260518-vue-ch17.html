<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chapter_17_vue是什麼?</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<style>
    .box01 {
        width: 180px;
        height: 180px;
        transition: transform 0.1s;
    }

    .rotate01 {
        transform: rotate(45deg);
    }

    .rotate02 {
        transform: rotate(85deg);
    }

    .rotate03 {
        transform: rotate(135deg);
    }
</style>

<body>
    <div id="app" class="container">
        <div class="row mt-4">
            <div class="displya-4">1.基本指今架構</div>
            <div class="displya-4 fw-bold text-success">{{ message01 }}</div>
            <button class="btn btn-primary">{{ message01}}</button>
            <hr class="mt-3">
        </div>
        <div class="row">
            <div class="displya-4 fw-bold">2.綁定資料</div>
            <div class="col-12">
                <div class="mb-3">
                    <label for="" class="form-label">品名</label>
                    <input type="text" class="form-control" name="" id="" v-model="pname">
                </div>
                <span>你輸入的資料為 <span class="h2">{{ pname }}</span></span>
            </div>
            <div class="col-12 mt-3">
                <label for="" class="form-label">數量</label>
                <input type="number" class="form-control" min="0" max="50" v-model="pnum">
                <span>你輸入的數量為 <span class="h2">{{ pnum }}</span></span>
            </div>

            <hr class="mt-3">
            <div class="displya-5 fw-bold">3.綁定圖片: v-bind</div>
            <img v-bind:src="imgsrc01" class="img-fluid" alt="">
            <img v-bind:src="imgsrc02" class="img-fluid" alt="">
            <img v-bind:src="imgsrc03" class="img-fluid" alt="">
            <img v-bind:src="imgsrc04" v-bind:class="classname" alt="">

            <div class="box01 border 
            border-primary my-3" v-bind:class="{'rotate01' : isRotate01,
            'rotate02' : isRotate02,
            'rotate03' : isRotate03}"></div>

            <button class="btn btn-primary me-2" v-on:click="isRotate02 = false, 
                isRotate03 = false,
                isRotate01 = !isRotate01">
                旋轉45度</button>

            <button class="btn btn-danger" v-on:click="isRotate01 = false, 
                 isRotate03 = false, 
                 isRotate02 = !isRotate02">
                旋轉85度</button>

            <button class="btn btn-success" v-on:click="isRotate01 = false,
             isRotate02 = false, 
             isRotate03 = !isRotate03">
                旋轉135度</button>

            <hr class="mt-3">
            <div class="displya-5 fw-bold text-primary">3.綁定資料: v-on</div>
            <button class="btn btn-success w-50" v-on:click="count++">點擊次數+1: {{ count }}</button>
            <button class="btn btn-danger w-50" v-on:click="count--">點擊次數-1: {{ count }}</button>

            <hr class="mt-3">
            <div class="mb-3">
                <label for="" class="form-label">反轉字串</label>
                <input type="text" class="form-control" v-model="reText" v-on:change="reverseText()">
                <div class="h2 mt-2">反轉字串:{{ reNewText}}</div>
            </div>

            <hr class="mt-3">
            <div class="display-5 text-primary fw-bold">v-for 和 v-if</div>
            <ul class="list-group">
                <template v-for="(item, index) in list">

                    <li class="list-group-item" v-if="item.price < 320">
                        {{ index+1 }} -- {{ item.product }} -- {{ item.price }}元
                    </li>
                </template>
            </ul>

        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/vue.global.js"></script>
    <script>
        Vue.createApp({
            data() {
                return {
                    message01: "hello Riize",
                    message02: "We Are Riize",
                    pname: "美式咖啡",
                    pnum: 10,
                    imgsrc01: "img/sky01.avif",
                    imgsrc02: "img/sky02.avif",
                    imgsrc03: "img/sky03.avif",
                    count: 0,
                    classname: "img-fluid",
                    isRotate01: false,
                    isRotate02: false,
                    isRotate03: false,
                    reText: "輸入字串",
                    reNewText: "反轉",
                    list: [
                        {
                            product: "草莓",
                            price: 100
                        },
                        {
                            product: "芒果",
                            price: 200
                        },
                        {
                            product: "香蕉",
                            price: 50
                        }
                    ]
                }
            },
            methods: {
                reverseText() {
                    this.reNewText = this.reText.split('').reverse().join('')
                }
            }
        }).mount("#app")
    </script>
</body>

</html>
