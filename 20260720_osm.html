<!DOCTYPE html>
<!-- 宣告 HTML5 網頁 -->

<html lang="zh-TW">
<!-- 網頁語言設定為繁體中文 -->

<head>

    <!-- 設定文字編碼，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 響應式網頁設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 網頁標題 -->
    <title>OSM 練習</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.min.css">

    <!-- Leaflet 地圖 CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

        <style>
            .leaflet-popup-content img{
    width: 100%;
    height: 200px;
    object-fit: cover;
}            
        </style>

</head>

<body>

    <!-- Bootstrap 滿版容器 -->
    <div class="container-fluid">

        <!-- Bootstrap Row -->
        <div class="row">

            <!-- 地圖佔滿整個畫面 -->
            <div class="col-md-12">

                <!-- 地圖放置的位置 -->
                <div id="map" class="vh-100"></div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        //----------------------------------------------------
        // 建立 OpenStreetMap 地圖
        //----------------------------------------------------

        // L.map() 建立地圖
        // map 是 HTML 裡面的 id
        // setView([緯度,經度],縮放倍率)

        var map = L.map('map').setView([24.171589,120.609514],15);

        //----------------------------------------------------
        // 載入 OpenStreetMap 地圖
        //----------------------------------------------------

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:'&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        //----------------------------------------------------
        // Popup 要顯示的內容
        //----------------------------------------------------

        let openHTML01 = `
        <!-- Bootstrap Card 開始 -->
        <div class="card" style="width:250px;">
            <!-- 卡片圖片 -->
            <!-- 圖片請放在 images 資料夾 -->
            <img src="img/af1e5ad7-85e2-4145-abea-5d53c2c3f719.png"
                 class="card-img-top"
                 alt="課程圖片">
            <!-- 卡片內容 -->
            <div class="card-body">
                <!-- 標題 -->
                <h5 class="card-title fw-bold text-primary">
                    XXX班級-職訓中心
                </h5>
                <!-- 課程介紹 -->
                <p class="card-text mb-1">
                    課程介紹：XXXX
                </p>
                <!-- 受訓時數 -->
                <p class="card-text mb-1">
                    受訓時數：XXXX
                </p>
                <!-- 費用 -->
                <p class="card-text mb-3">
                    費用：XXXX
                </p>
                <!-- 報名按鈕 -->
                <a href="#"
                   class="btn btn-primary w-100">
                   我要報名
                </a>
            </div>
        </div> `;
        //----------------------------------------------------
        // 建立 Marker
        //----------------------------------------------------
        L.marker([24.1820280, 120.6026670])
        // 加到地圖
        .addTo(map)
        // 點擊 Marker 顯示 Bootstrap Card
        .bindPopup(openHTML01,{ minWidth:400, maxWidth:600});

        let openHTML02 = `
        <!-- Bootstrap Card 開始 -->
        <div class="card" style="width:250px;">
            <!-- 卡片圖片 -->
            <!-- 圖片請放在 images 資料夾 -->
            <img src="img/af1e5ad7-85e2-4145-abea-5d53c2c3f719.png"
                 class="card-img-top"
                 alt="課程圖片">
            <!-- 卡片內容 -->
            <div class="card-body">
                <!-- 標題 -->
                <h5 class="card-title fw-bold text-primary">
                    XXX班級-東海大學
                </h5>
                <!-- 課程介紹 -->
                <p class="card-text mb-1">
                    課程介紹：XXXX
                </p>
                <!-- 受訓時數 -->
                <p class="card-text mb-1">
                    受訓時數：XXXX
                </p>
                <!-- 費用 -->
                <p class="card-text mb-3">
                    費用：XXXX
                </p>
                <!-- 報名按鈕 -->
                <a href="#"
                   class="btn btn-primary w-100">
                   我要報名
                </a>
            </div>
        </div> `;
        //----------------------------------------------------
        // 建立 Marker
        //----------------------------------------------------
        L.marker([24.176599, 120.617429])
        // 加到地圖
        .addTo(map)
        // 點擊 Marker 顯示 Bootstrap Card
        .bindPopup(openHTML02,{ minWidth:400, maxWidth:600});
    </script>

</body>

</html>
