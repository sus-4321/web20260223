<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <div class="container py-4">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-xl-4">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center bg-white">
                        <div class="fs-5">訂單編號 #XXX</div>
                        <span class="badge text-bg-warning">待處理</span>
                    </div>

                    <div class="card-body">
                        <div class="mb-3">
                            <div class="fs-5 fw-bold">王小名</div>
                            <div class="text-secondary">用餐人數: 10人</div>
                        </div>
                        <div class="border-top pt-3">
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">取餐方式</span>
                                <span class="fw-bold">櫃台取餐</span>
                            </div>
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">付款方式</span>
                                <span class="fw-bold">現金</span>
                            </div>
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">點餐數量</span>
                                <span class="fw-bold">3項</span>
                            </div>
                            <div class="mb-2 d-flex justify-content-between">
                                <span class="text-secondary">備註</span>
                                <span class="fw-bold">不用餐具</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="mb-2 d-flex justify-content-between align-items-center">
                            <span class="fw-bold">總金額</span>
                            <span class="fw-bold fs-4 text-danger">1000元</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary flex-fill">查看明細</button>
                            <button class="btn btn-success flex-fill">修改訂單</button>
                            <button class="btn btn-outline-danger flex-fill">刪除訂單</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
