<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch11 表單(JavaScript)</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/mycss-ai.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 shadow p-2 rounded-4">
                <div class="h2 text-bg-primary py3 text-center rounded-4">產品建檔(水果)</div>
                <div class="mb-3">
                    <label for="" class="form-label">產品名稱</label>
                    <input type="text" class="from-control" id="pname">
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">產品數量</label>
                    <input type="number" min="1" max="100" class="from-control" id="pnum">
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">容量</label>
                    <input type="text" class="form-control" list="pnamelist_text">
                    <datalist id="pnums_text">
                        <option value="250 cc"></option>
                        <option value="500 cc"></option>
                        <option value="750 cc"></option>
                        <option value="1000 cc"></option>
                    </datalist>
                </div>

                <div>
                    <div class="text-end">
                    <button class="btn btn-primary" id="Yes_btn">確定</button>
                    <button class="btn btn-info">取消</button>
                </div>
                </div>
            </div>
        </div>
    </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-8 shadow p-4 rounded-2">
                <div class="h2 text-bg-success py-2 text-center rounded-4">結果確定</div>
                <div class="h3">產品名稱: <span class="h1 fw-bold text-danger" id="pname_text">MMMMMM</span></div>
                <div class="h3">產品數量: <span class="h1 fw-bold text-danger" id="pnum_text">MMMMMM</span></div>

                <div class="h3">產品規格: <span class="h1 fw-bold text-danger" id="pnamelist_text">MMMMMM</span></div>
            </div>
        </div>


    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script>
        $(function(){
            // 監聴按鈕 #Yes_btn
            $("#Yes_btn").click(function(){
                console.log($("#pname").val());
                console.log($("#pnum").val());
                console.log($("#pstandard").val());

                $("#pname_text").text($("#pname").val());
                $("#pnum_text").text($("#pnum").val());
                $("#pnamelist_text").text($("#pstandard").val());
            });
        })
    </script>
</body>
</html>
