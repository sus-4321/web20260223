<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA 極光主題飯店 | 重新定義您的旅行高度</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* 基礎背景設定 */
        .bg-cover {
            background-position: center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        /* 你練習過的 Roller 核心效果 */
        .roller {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 40, 80, 0.8);
            /* 深藍色半透明遮罩 */
            display: flex;
            flex-column: center;
            align-items: center;
            justify-content: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            text-align: center;
        }

        /* 定義滑入方向 */
        .roller-box-bottom .roller {
            transform: translateY(100%);
        }

        .roller-box-top .roller {
            transform: translateY(-100%);
        }

        .roller-box-left .roller {
            transform: translateX(-100%);
        }

        /* Hover 觸發回原位 */
        .bg-cover:hover .roller {
            transform: translate(0, 0);
        }

        /* 導覽列與文字微調 */
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 2px;
        }

        .hero-text {
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        .boutton :hover{
            transition: background-color 0.3s ease, transform 0.3s ease;
            background-color: #48e721;
        }
    </style>
</head>

<body>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-12 bg-cover vh-100 d-flex align-items-center justify-content-center"
                style="background-image: url('img/hero-hotel05.avif');">
                <div class="text-center text-white hero-text">
                    <h1 class="display-2 fw-bold">AURORA HOTEL</h1>
                    <p class="lead mb-4">在世界的盡頭，尋找最溫暖的光</p>
                    <a href="#cart-plus" class="btn btn-outline-light btn-lg px-5">
                        <i class="bi bi-cart-plus me-2"></i>
                        立即預訂</a>
                </div>

            </div>
        </div>
    </div>

    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-md-6 bg-cover roller-box-left"
                style="background-image: url('img/hero-hotel01.avif'); height: 60vh;">
                <div class="roller">
                    <h2 class="text-white">尊爵套房服務</h2>
                    <p class="text-white-50">24小時管家貼身服務，享受極致隱私與奢華</p>
                    <button class="btn btn-primary">探索更多</button>
                </div>
            </div>

            <div class="col-md-6">
                <div class="d-flex flex-column h-100">
                    <div class="h-50 bg-cover roller-box-top" style="background-image: url('img/hero-hotel02.avif');">
                        <div class="roller">
                            <h3 class="text-white">極地療癒 SPA</h3>
                            <p class="text-white-50">來自冰川的高純度礦石按摩</p>
                        </div>
                    </div>
                    <div class="h-50 bg-cover roller-box-bottom"
                        style="background-image: url('img/hero-hotel03.avif');">
                        <div class="roller">
                            <h3 class="text-white">米其林星級饗宴</h3>
                            <p class="text-white-50">品嚐當季最鮮甜的北歐海味</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5 bg-dark text-white">
        <div class="row align-items-center py-5">
            <div class="col-md-8 offset-md-2 text-center">
                <h2 class="mb-4">加入 AURORA 會員，開啟您的專屬旅程</h2>
                <p class="mb-5 opacity-75">現在註冊即可享有首度預約 85 折優惠，以及免費接駁服務。我們不僅提供住宿，更提供您一生難忘的記憶。</p>
                <div class="d-flex justify-content-center gap-3">
                    <input type="email" class="form-control w-50" placeholder="請輸入您的 Email 地址">
                    <button class="btn btn-danger px-4">訂閱優惠</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-black text-white-50 py-3 text-center">
        <small>© 2026 AURORA Hotel Group. All Rights Reserved.</small>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
