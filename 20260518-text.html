<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點餐系統</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

    <div class="container py-5" id="app">

        <!-- 點餐區 -->
        <div class="row">

            <div class="col-12">

                <!-- 餐點01 -->
                <div class="form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        value="餐點01"
                        v-model="chkArray">

                    <label class="form-check-label">
                        餐點01
                    </label>
                </div>

                <!-- 餐點02 -->
                <div class="form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        value="餐點02"
                        v-model="chkArray">

                    <label class="form-check-label">
                        餐點02
                    </label>
                </div>

                <!-- 餐點03 -->
                <div class="form-check">
                    <input type="checkbox"
                        class="form-check-input"
                        value="餐點03"
                        v-model="chkArray">

                    <label class="form-check-label">
                        餐點03
                    </label>
                </div>

                <!-- 付款方式 -->
                <div class="mt-3">

                    <!-- 現金 -->
                    <div class="form-check">
                        <input type="radio"
                            class="form-check-input"
                            value="現金"
                            v-model="radioPay">

                        <label class="form-check-label">
                            現金
                        </label>
                    </div>

                    <!-- 刷卡 -->
                    <div class="form-check">
                        <input type="radio"
                            class="form-check-input"
                            value="刷卡"
                            v-model="radioPay">

                        <label class="form-check-label">
                            刷卡
                        </label>
                    </div>

                    <!-- Line Pay -->
                    <div class="form-check">
                        <input type="radio"
                            class="form-check-input"
                            value="Line Pay"
                            v-model="radioPay">

                        <label class="form-check-label">
                            Line Pay
                        </label>
                    </div>

                </div>

            </div>

        </div>

        <!-- 顯示點餐內容 -->
        <div class="row mt-5" v-if="chkArray.length > 0">

            <div class="col-12">

                <div class="h2 text-bg-success rounded-2 text-center py-3">
                    點餐內容
                </div>

                <ul class="list-group">

                    <li class="list-group-item"
                        v-for="(item,index) in chkArray">

                        {{ index + 1 }} - {{ item }}

                    </li>

                </ul>

                <!-- 顯示付款方式 -->
                <div class="fs-3 text-primary mt-3">

                    付款方式: {{ radioPay }}

                </div>

            </div>

        </div>

    </div>

    <script>

        Vue.createApp({

            data() {

                return {

                    // checkbox 陣列
                    chkArray: [],

                    // radio 單選
                    radioPay: ""

                }

            }

        }).mount("#app")

    </script>

</body>

</html>
